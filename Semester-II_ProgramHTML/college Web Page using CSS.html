<!DOCTYPE html>
<html>
<head>
    <title>College Web Page</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="ExternalStyle.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        .content {
            padding: 20px;
            border: 2px solid gray;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="font-size: 40px;">ABC College</h1>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <h2>Welcome to Our College</h2>

    <div class="content">
        <p style="color: blue;">  <!-- Inline CSS -->
            ABC College is one of the best institutions providing quality education.
        </p>

        <h3 style="color: maroon;">Courses Offered</h3> <!-- Inline CSS -->
        <ul>
            <li>BCA</li>
            <li>BBA</li>
            <li>B.Com</li>
        </ul>

        <h3>Class Time Table</h3>

        <table>
            <tr>
                <th>Day</th>
                <th>Subject</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>Math</td>
                <td>10:00 AM</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Computer</td>
                <td>11:00 AM</td>
            </tr>
        </table>
    </div>

    <div class="footer">
        <p>&copy; 2026 ABC College</p>
    </div>

</body>
</html>
