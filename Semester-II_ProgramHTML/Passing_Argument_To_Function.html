<html>
    <head>
        <title>Passing_Argument_To_Function</title>
    </head>
    <body>
        <script language = "JavaScript">
document.writeln("The minimum of 1 and 2 is: " +min(1,2))
function min(value1, value2){
    if(value1 > value2){
        return(value2)
    }
    else
    return(value1)
}
        </script>
        <Center>
            <h1>using function to javascript</h1>
        </Center>
    </body>
    </html>
