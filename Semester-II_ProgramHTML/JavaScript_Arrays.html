<html>
    <head>
        <title>An Array Example</title>
    </head>
    <body>
        <script language = "JavaScript">
            let data = new Array
            let total = 0

            data[0] = 1
            data[1] = 2
            data[2] = 3
            data[3] = 4
            data[4] = 5
            data[5] = 6
            data[6] = 7
for(let loopIndex = 0; loopIndex < data.length; loopIndex++){
    total = total + data[loopIndex]
    }
        document.write("The average value of your data is: "+ total / data.length)

            </script>

            <center>
                <h1>Using JavaScipt Arrays</h1>
            </center>
    </body>
    </html>
