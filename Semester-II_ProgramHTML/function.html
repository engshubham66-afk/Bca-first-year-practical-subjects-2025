<html>
    <head>
        <title>Using Functions in JavaScript</title>
    </head>
    <body>
        <script language = "JavaScript">
document.writeln(getCurrentTime())
function getCurrentTime(){
    var time = new Date 
    var returnValue = "The current time is: "+time.getHours() + ":" + time.getMinutes()
    return (returnValue)
}
        </script>
        <Center>
            <h1>using function to javascript</h1>
        </Center>
    </body>
    </html>
